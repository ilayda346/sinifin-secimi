<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sınıfın Seçimi</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="hero"><h1>📚 Sınıfın Seçimi</h1><p class="muted">Kodunu seç, oyunu kullan, sınıfın kararını birlikte verin!</p></header><section class="panel"><div class="row"><h2 id="stage">Yükleniyor…</h2><span id="total" class="muted"></span></div><p id="intro">Aşağıdaki dört koddan birini seç.</p><div id="options" class="grid"></div><div class="row" style="margin-top:16px"><button id="vote" class="btn" disabled>Seçimimi gönder</button><span id="message"></span></div></section><section class="panel"><h2>📖 Kitaplıkta bulunan kitaplar</h2><div id="books"></div></section></main><script>
let game=null,selected=null;const $=id=>document.getElementById(id);
function voter(){let v=localStorage.getItem("crud-voter");if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem("crud-voter",v)}return v}
async function load(){try{const [g,b]=await Promise.all([fetch("/api/game").then(r=>r.json()),fetch("/api/books").then(r=>r.json())]);game=g;selected=null;$("stage").textContent=g.stage==="DONE"?"Oyun tamamlandı":g.stageName;$("total").textContent=`${g.total} oy kullanıldı`;$("intro").textContent=g.stage==="DONE"?"Tüm CRUD aşamaları tamamlandı. Öğretmen yeni oyun başlatabilir.":"Kodları incele ve sınıfın için bir seçenek belirle."; $("options").innerHTML=g.options.map(o=>`<article class="option" data-key="${o.key}"><h3>${o.label}</h3><p>${o.description}</p><pre>${escapeHtml(o.code)}</pre><small>Oy: ${g.counts[o.key]||0}</small><div class="bar"><span style="width:${g.total?100*(g.counts[o.key]||0)/g.total:0}%"></span></div></article>`).join("");document.querySelectorAll(".option").forEach(el=>el.onclick=()=>{selected=el.dataset.key;document.querySelectorAll(".option").forEach(x=>x.classList.toggle("selected",x===el));$("vote").disabled=false});$("vote").disabled=g.stage==="DONE";$("books").innerHTML=b.length?`<ul>${b.map(x=>`<li><b>${escapeHtml(x.title)}</b> — ${escapeHtml(x.author)}</li>`).join("")}</ul>`:"Henüz kitap yok."}catch(e){$("message").textContent="Sunucuya bağlanılamadı."}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("vote").onclick=async()=>{if(!selected)return;const r=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({optionKey:selected,voterKey:voter()})});const d=await r.json();$("message").textContent=d.message||d.error;await load()};load();setInterval(load,5000);
</script></body></html>
